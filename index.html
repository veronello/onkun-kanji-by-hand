<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KANJI ON — practise on and kun readings by writing kanji on paper." />
    <meta name="theme-color" content="#f8f9fa" />
    <title>KANJI ON — Kanji by Hand</title>
    <link rel="icon" href="favicon.ico?v=green1" sizes="any" />
    <link rel="icon" href="favicon.svg?v=green1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-green-v1.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="KANJI ON" />
    <script>
      try {
        if (localStorage.getItem("onkun-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#191919";
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css?v=20261009-badges1" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="KANJI ON — Kanji by hand">
        <span class="brand-wordmark" aria-hidden="true">
          <span class="brand-kanji">KANJI</span>
          <span class="brand-switch"><span>ON</span><span class="brand-knob"></span></span>
        </span>
        <span class="brand-tagline" aria-hidden="true">Kanji by hand</span>
      </a>
      <div class="header-controls">
      <div class="language-switcher" aria-label="Language">
        <button class="language-button" data-language="ru" type="button">RU</button>
        <span aria-hidden="true">/</span>
        <button class="language-button" data-language="en" type="button">EN</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark theme</button>
      </div>
    </header>

    <main id="home">

      <section class="path" aria-labelledby="path-title">
        <div class="section-heading">
          <div>
            <h2 id="path-title" data-i18n="aboutTitle">About the project</h2>
          </div>
        </div>
        <div class="path-grid">
          <article class="path-card path-card--intro">
            <p data-i18n="aboutText">The exercises draw on the author's own study materials, compiled during her university years starting in 2013, and are supplemented with new original exercises.</p>
          </article>
          <button class="path-card" id="on-card" type="button" data-coming-soon>
            <span class="mode-badge" aria-hidden="true">ON</span>
            <h3 data-i18n="onTitle">On readings</h3>
            <p data-i18n="onText">Kanji review through compounds with on readings.</p>
            <span class="card-link" data-i18n="comingSoon">Coming soon</span>
          </button>
          <button class="path-card" type="button" data-coming-soon>
            <span class="mode-badge" aria-hidden="true">KUN</span>
            <h3 data-i18n="kunTitle">Kun readings</h3>
            <p data-i18n="kunText">Kanji review through words with kun readings.</p>
            <span class="card-link" data-i18n="comingSoon">Coming soon</span>
          </button>
          <button class="path-card" type="button" data-coming-soon>
            <span class="mode-badge" aria-hidden="true">ON-KUN</span>
            <h3 data-i18n="mixedTitle">Mixed practice</h3>
            <p data-i18n="mixedText">Kanji review with a mix of on and kun readings.</p>
            <span class="card-link" data-i18n="comingSoon">Coming soon</span>
          </button>
          <button class="path-card" type="button" data-coming-soon>
            <span class="mode-badge" aria-hidden="true">OFF</span>
            <h3 data-i18n="testTitle">Final test</h3>
            <p data-i18n="testText">A full-block recall test with answers shown at the end.</p>
            <span class="card-link" data-i18n="comingSoon">Coming soon</span>
          </button>
          <article class="path-card" id="misc">
            <span class="mode-badge" aria-hidden="true">MISC</span>
            <h3 data-i18n="miscTitle">Miscellaneous</h3>
            <p data-i18n="miscText">Sources, articles, interesting materials, and photos.</p>
            <span class="card-link" data-i18n="comingSoon">Coming soon</span>
          </article>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <footer><span>2026</span></footer>
    <script src="script.js?v=20261008-misc1"></script>
  </body>
</html>
